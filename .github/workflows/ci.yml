name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest: OCaml 4.13 doesn't build with the
        # newer runner's GCC (C23 default), and 4.13 is the declared lower bound.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        ocaml-compiler:
          - "4.13"
          - "4.14"
          - "5.4"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      # Name the main opam file explicitly: `opam install .` would also pick up
      # xoshiro-simd-afl.opam and xoshiro-simd-bench.opam.
      - run: opam install ./xoshiro-simd.opam --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  # Like opam-repo-ci's lower-bounds job: every dependency (dune and the test
  # libraries included) at the oldest version the opam file allows, then the
  # opam file's own build command. Catches dune files that only newer dune
  # accepts, which the build job above can't see.
  lower-bounds:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - "4.13"
          - "5.4"
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: "+removed,+count[version-lag,solution]"
      OPAMFIXUPCRITERIA: "+removed,+count[version-lag,solution]"
      OPAMUPGRADECRITERIA: "+removed,+count[version-lag,solution]"
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      # The solver opam-repo-ci uses for these criteria.
      - run: opam option solver=builtin-0install
      - run: opam install ./xoshiro-simd.opam --deps-only --with-test
      - run: opam list
      - run: opam exec -- dune build -p xoshiro-simd @install @runtest
